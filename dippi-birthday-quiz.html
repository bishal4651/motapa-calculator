<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Happy Birthday, Dippi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blossom:#ffd1e8; --lilac:#e3d4ff; --sky:#cdebff; --mint:#c9f5da;
    --berry:#d6488f; --plum:#6b3a5c; --gold:#ffb703; --violet:#8a5cf6;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow-x:hidden; font-family:'Quicksand', system-ui, sans-serif; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, var(--blossom), var(--lilac) 40%, var(--sky) 75%, var(--mint));
    background-size:300% 300%; animation: skyDrift 14s ease infinite;
    padding: 24px 16px;
  }
  @keyframes skyDrift { 0%,100%{background-position:0% 40%;} 50%{background-position:100% 60%;} }

  #app { width:100%; max-width:440px; transition: opacity 0.22s ease, transform 0.22s ease; }
  #app.fade-out { opacity:0; transform:translateY(6px); }

  .screen { text-align:center; }

  .card-shell {
    background:rgba(255,255,255,0.6); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:2px solid rgba(255,255,255,0.75); border-radius:30px;
    box-shadow:0 22px 55px rgba(120,90,120,0.25);
    padding:32px 22px;
  }

  .emoji-badge { font-size:52px; display:block; margin-bottom:10px; animation:bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }

  .title { font-family:'Baloo 2', sans-serif; font-weight:800; font-size:clamp(24px,7vw,32px); color:var(--berry); }
  .subtitle { font-size:14.5px; color:var(--plum); margin-top:8px; line-height:1.5; }

  .primary-btn {
    margin-top:22px; border:none; cursor:pointer; padding:13px 30px; border-radius:999px;
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:15px; color:#fff;
    background:linear-gradient(135deg, var(--berry), var(--violet));
    box-shadow:0 10px 24px rgba(178,72,143,0.35);
    transition: transform 0.15s ease;
  }
  .primary-btn:active { transform:scale(0.96); }

  .progress-track { width:100%; height:5px; border-radius:99px; background:rgba(255,255,255,0.55); overflow:hidden; margin-bottom:14px; }
  .progress-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--berry),var(--violet)); transition:width 0.4s ease; }
  .progress-label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--plum); opacity:0.6; margin-bottom:6px; }

  .round-title { font-family:'Baloo 2', sans-serif; font-weight:800; font-size:clamp(20px,6vw,26px); color:var(--berry); margin:6px 0 18px; }

  .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .option-card {
    position:relative; border:none; cursor:pointer; padding:0; overflow:hidden;
    border-radius:20px; background:rgba(255,255,255,0.55); border:2px solid rgba(255,255,255,0.7);
    box-shadow:0 10px 22px rgba(120,90,120,0.18);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    display:flex; flex-direction:column;
  }
  .option-card img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; }
  .option-card .caption { font-size:12.5px; font-weight:700; color:var(--plum); padding:8px 6px; line-height:1.3; }
  .option-card.selected { transform:scale(1.04); box-shadow:0 0 0 3px var(--berry), 0 16px 30px rgba(178,110,160,0.4); }
  .option-card.dim { opacity:0.4; transform:scale(0.97); }
  .option-card.selected::after {
    content:'\2713'; position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%;
    background:var(--berry); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; box-shadow:0 4px 10px rgba(0,0,0,0.2);
  }

  .prep-screen .title { margin-bottom:26px; }
  .candle-wrap { background:none; border:none; cursor:pointer; display:inline-flex; flex-direction:column; align-items:center; padding:10px; }
  .flame {
    width:14px; height:20px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff59d, #ff9800 60%, #e65100);
    margin-bottom:-3px; animation: flicker 1.3s ease-in-out infinite; transform-origin:bottom center;
    box-shadow: 0 0 18px 5px rgba(255,183,77,0.55);
  }
  @keyframes flicker { 0%,100%{transform:scale(1) rotate(-3deg);} 50%{transform:scale(1.1) rotate(3deg);} }
  .candle-body {
    width:16px; height:74px; border-radius:5px;
    background: repeating-linear-gradient(180deg, var(--blossom) 0 8px, #fff0f6 8px 16px);
    box-shadow: inset -3px 0 6px rgba(0,0,0,0.08);
  }
  .candle-plate { width:70px; height:12px; border-radius:50%; background:rgba(255,255,255,0.6); margin-top:2px; filter:blur(1px); }
  .prep-screen .subtitle { margin-top:20px; }

  .finale-screen { position:relative; }
  .scene { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .balloon { position:absolute; bottom:-160px; width:52px; height:66px; border-radius:50% 50% 48% 48% / 55% 55% 45% 45%; animation: floatUp linear infinite; }
  .balloon::after { content:''; position:absolute; top:100%; left:50%; width:1px; height:34px; background:rgba(107,58,92,0.3); transform:translateX(-50%); }
  @keyframes floatUp {
    0% { transform:translateY(0) translateX(0) rotate(-5deg); }
    30% { transform:translateY(-32vh) translateX(4vw) rotate(4deg); }
    60% { transform:translateY(-64vh) translateX(-3vw) rotate(-4deg); }
    100% { transform:translateY(-118vh) translateX(2vw) rotate(3deg); }
  }
  .confetti { position:absolute; top:-24px; animation: fallDown linear infinite; }
  @keyframes fallDown { 0%{transform:translateY(0) rotate(0);opacity:1;} 100%{transform:translateY(120vh) rotate(360deg);opacity:0.85;} }
  .sparkle { position:absolute; border-radius:50%; background:#fff; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:0; transform:scale(0.3);} 50%{opacity:1; transform:scale(1);} }

  .hero-frame {
    position:relative; z-index:2; width:132px; height:132px; border-radius:50%; overflow:hidden;
    margin:0 auto 14px; border:4px solid rgba(255,255,255,0.85); box-shadow:0 14px 34px rgba(120,90,120,0.35);
  }
  .hero-frame img { width:100%; height:100%; object-fit:cover; }
  .finale-screen .card-shell { position:relative; z-index:2; }
  .headline {
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:clamp(24px,7vw,32px);
    background:linear-gradient(90deg, var(--berry), var(--violet), var(--gold), var(--berry));
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 3s linear infinite;
  }
  @keyframes shimmer { to { background-position:300% center; } }
  .name { font-family:'Baloo 2', sans-serif; font-weight:800; font-size:clamp(28px,8vw,38px); color:var(--berry); margin-top:2px; }
  .badge {
    display:inline-block; margin-top:10px; padding:6px 18px; border-radius:999px;
    background:linear-gradient(135deg, var(--blossom), var(--lilac)); color:var(--plum);
    font-weight:700; font-size:14px; transform:rotate(-3deg); box-shadow:0 5px 12px rgba(178,110,160,0.25);
  }
  .message {
    margin-top:16px; padding:14px 16px; border-radius:18px; background:rgba(255,255,255,0.78);
    border:1.5px dashed var(--berry); font-weight:600; font-size:14.5px; color:var(--plum); line-height:1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>

const app = document.getElementById('app');
let selecting = false;

function swap(renderFn) {
  app.classList.add('fade-out');
  setTimeout(() => { renderFn(); app.classList.remove('fade-out'); }, 220);
}

function renderStart() {
  app.innerHTML = `
    <div class="screen start-screen">
      <div class="card-shell">
        <span class="emoji-badge">🎂</span>
        <h1 class="title">Hey ${DATA.name}!</h1>
        <p class="subtitle">Answer a few this-or-thats to unlock your birthday surprise</p>
        <button class="primary-btn" id="startBtn">Let's go →</button>
      </div>
    </div>`;
  document.getElementById('startBtn').onclick = () => swap(() => renderRound(0));
}

function renderRound(i) {
  const round = DATA.rounds[i];
  const pct = (i / DATA.rounds.length) * 100;
  app.innerHTML = `
    <div class="screen round-screen">
      <div class="card-shell">
        <div class="progress-label">Round ${i + 1} of ${DATA.rounds.length}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <h2 class="round-title">${round.title}</h2>
        <div class="options-grid">
          ${round.options.map((opt, idx) => `
            <button class="option-card" data-idx="${idx}">
              <img src="${opt.img}" alt="${opt.caption}" />
              <span class="caption">${opt.caption}</span>
            </button>
          `).join('')}
        </div>
      </div>
    </div>`;

  const cards = app.querySelectorAll('.option-card');
  cards.forEach(card => {
    card.onclick = () => {
      if (selecting) return;
      selecting = true;
      const chosenIdx = card.dataset.idx;
      cards.forEach(c => {
        if (c.dataset.idx === chosenIdx) c.classList.add('selected');
        else c.classList.add('dim');
      });
      setTimeout(() => {
        selecting = false;
        if (i + 1 < DATA.rounds.length) swap(() => renderRound(i + 1));
        else swap(renderPrep);
      }, 420);
    };
  });
}

function renderPrep() {
  app.innerHTML = `
    <div class="screen prep-screen">
      <div class="card-shell">
        <h2 class="title">Almost there...</h2>
        <button class="candle-wrap" id="candleBtn" aria-label="Light the candle">
          <div class="flame"></div>
          <div class="candle-body"></div>
          <div class="candle-plate"></div>
        </button>
        <p class="subtitle">Tap the candle to make a wish 🕯️</p>
      </div>
    </div>`;
  document.getElementById('candleBtn').onclick = () => swap(renderFinale);
}

function renderFinale() {
  app.innerHTML = `
    <div class="screen finale-screen">
      <div class="scene" id="scene"></div>
      <div class="card-shell">
        <div class="hero-frame"><img src="${DATA.hero}" alt="${DATA.name}" /></div>
        <div class="headline">Happy Birthday</div>
        <div class="name">${DATA.name}</div>
        <div class="badge">✨ ${DATA.age} ✨</div>
        <div class="message">${DATA.message}</div>
      </div>
    </div>`;
  burst();
}

function burst() {
  const scene = document.getElementById('scene');
  const rand = (a, b) => Math.random() * (b - a) + a;
  const balloonColors = ['#ffb6d9','#c9a6ff','#a6d4ff','#ffe08a','#a8f0c6'];
  const confettiColors = ['#ff9ec7','#c9a6ff','#ffd166','#8ecdff','#a8f0c6'];

  for (let i = 0; i < 8; i++) {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = rand(3, 88) + 'vw';
    b.style.background = `radial-gradient(circle at 30% 28%, #ffffffcc, ${balloonColors[i % balloonColors.length]})`;
    b.style.animationDuration = rand(9, 15) + 's';
    b.style.animationDelay = '-' + rand(0, 6) + 's';
    scene.appendChild(b);
  }
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    const w = rand(6, 11);
    c.style.width = w + 'px';
    c.style.height = (w * rand(0.4, 1)) + 'px';
    c.style.left = rand(0, 100) + 'vw';
    c.style.background = confettiColors[i % confettiColors.length];
    c.style.animationDuration = rand(4.5, 8) + 's';
    c.style.animationDelay = '-' + rand(0, 3) + 's';
    scene.appendChild(c);
  }
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = rand(2, 5);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = rand(0, 100) + 'vw';
    s.style.top = rand(0, 100) + 'vh';
    s.style.animationDuration = rand(1.6, 3.2) + 's';
    s.style.animationDelay = '-' + rand(0, 3) + 's';
    scene.appendChild(s);
  }
}

renderStart();
</script>
